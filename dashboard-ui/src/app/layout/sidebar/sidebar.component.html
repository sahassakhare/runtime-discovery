<div class="sidebar-wrapper">
    <div class="logo-area">
        <div class="logo-icon">M</div>
        <span class="brand-name">Maverick</span>
    </div>

    <mat-nav-list class="nav-menu">
        <a mat-list-item *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active-link"
            #rla="routerLinkActive">
            <mat-icon matListItemIcon [color]="rla.isActive ? 'primary' : ''">{{item.icon}}</mat-icon>
            <span matListItemTitle class="nav-label">{{item.label}}</span>
        </a>
    </mat-nav-list>

    <div class="spacer"></div>
    <mat-divider></mat-divider>

    <div class="user-profile">
        <div class="avatar">A</div>
        <div class="user-info">
            <span class="name">Admin User</span>
            <span class="role">Platform Owner</span>
        </div>
    </div>
</div>
