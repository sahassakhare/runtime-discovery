server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.maverick.feature: DEBUG
    org.springframework.web: DEBUG

spring:
  application:
    name: mfe-feature-service
  datasource:
    url: jdbc:h2:mem:maverickdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

togglz:
  console:
    enabled: true
    path: /togglz-console
    secured: false

# Custom MFE Configuration
mfe:
  remote-urls:
    remote-profile: http://localhost:4201/remoteEntry.js
  tenants:
    - id: acme
      name: Acme Corp
    - id: beta-users
      name: Beta Testers Group
  context:
    keys:
      roles: user.roles
      department: user.department
      internal: user.internal
      authenticated: user.authenticated
      userId: user.id
    defaults:
      department: UNASSIGNED
      internal: false
      authenticated: false
      userId: anonymous
  governance:
    opa:
      mode: embedded # Options: sidecar, embedded
      baseUrl: http://localhost:8181/v1/data
      binaryPath: /Users/sahassakhare/Downloads/mfe-discovery-client/mfe-feature-service/opa

llm:
  api-key: ${GEMINI_API_KEY:dummy-key-for-local-boot}
  model: gemini-2.0-flash-exp
